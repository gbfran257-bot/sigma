version: "3"
services:
  mysql: #Importante el hostname para poner en el archivo horizonte.php es: mysql
    platform: linux/x86_64
    image: mysql:5.7
    container_name: sigma_mysql
    restart: always
    environment: #Poner las mismas credenciales que en el archivo horizonte.php 
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=cr
      - MYSQL_USER=test
      - MYSQL_PASSWORD=test
    #descomentar para acceder a la base de datos desde el host 
    # ports: 
    #   - 3306:3306
    networks:
      - sigma_network
    volumes:
      - mysql_data:/var/lib/mysql

  php:
    container_name: sigma_php
    restart: always
    ports:
      - 8000:80
    networks:
      - sigma_network
    volumes:
      - .:/var/www/html
    build:
      context: .
      dockerfile: Dockerfile

networks:
  sigma_network:
    name: sigma_dev_network
    driver: bridge

volumes:
  mysql_data: